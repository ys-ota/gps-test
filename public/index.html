<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS トラッカー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header { background: #1a1d27; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2d3045; }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .status-dot.active { background: #4caf50; box-shadow: 0 0 6px #4caf50; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  .main { display: flex; flex: 1; overflow: hidden; }

  #map { flex: 1; }

  .sidebar { width: 320px; background: #1a1d27; overflow-y: hidden; border-left: 1px solid #2d3045; display: flex; flex-direction: column; }
  .sidebar-title { padding: 14px 16px; font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #2d3045; }

  .device-card { padding: 14px 16px; border-bottom: 1px solid #2d3045; cursor: pointer; transition: background .15s; }
  .device-card:hover { background: #22253a; }
  .device-card.selected { background: #1e2f4a; border-left: 3px solid #4a90e2; }
  .device-id { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; }
  .device-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; color: #999; }
  .device-meta span { display: flex; align-items: center; gap: 4px; }
  .val { color: #ccc; font-weight: 500; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .badge.green { background: #1b3a2a; color: #4caf50; }
  .badge.yellow { background: #3a2e1b; color: #ffc107; }
  .badge.red { background: #3a1b1b; color: #f44336; }
  .time { font-size: 11px; color: #555; margin-top: 6px; }

  #no-data { padding: 40px 20px; text-align: center; color: #444; font-size: 14px; }

  .detail-panel { background: #12151f; border-top: 1px solid #2d3045; padding: 16px; }
  .detail-panel h3 { font-size: 13px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .detail-item { background: #1a1d27; border-radius: 6px; padding: 8px 10px; }
  .detail-label { font-size: 11px; color: #666; margin-bottom: 2px; }
  .detail-value { font-size: 14px; color: #e0e0e0; font-weight: 500; }

  .log-panel { border-top: 1px solid #2d3045; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .log-header { padding: 10px 16px; font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .log-clear { font-size: 11px; color: #555; cursor: pointer; padding: 2px 8px; border: 1px solid #333; border-radius: 4px; background: none; }
  .log-clear:hover { color: #aaa; border-color: #555; }
  .log-list { overflow-y: auto; flex: 1; }
  .log-row { padding: 6px 16px; border-bottom: 1px solid #1e2130; font-size: 12px; display: grid; grid-template-columns: 70px 1fr; gap: 8px; cursor: pointer; }
  .log-row:hover { background: #1e2235; }
  .log-time { color: #4a90e2; font-variant-numeric: tabular-nums; }
  .log-coords { color: #999; }
  .log-speed { color: #666; font-size: 11px; }
</style>
</head>
<body>

<header>
  <div class="status-dot" id="statusDot"></div>
  <h1>📍 GPS トラッカー</h1>
  <span id="connStatus" style="font-size:12px;color:#ffc107">接続中...</span>
  <span id="lastUpdate" style="margin-left:auto;font-size:12px;color:#555">データ待機中...</span>
</header>

<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <div class="sidebar-title">端末一覧</div>
    <div id="deviceList"><div id="no-data">まだデータがありません<br><br>アプリから送信すると<br>ここに表示されます</div></div>
    <div class="detail-panel" id="detailPanel" style="display:none">
      <h3>詳細</h3>
      <div class="detail-grid" id="detailGrid"></div>
    </div>
    <div class="log-panel">
      <div class="log-header">
        受信ログ
        <button class="log-clear" onclick="clearLog()">クリア</button>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>
</div>

<script>
const map = L.map('map').setView([35.6812, 139.7671], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

const markers = {};
const polylines = {};
const devices = {};
let selectedId = null;
const logEntries = [];

function addLog(d) {
  logEntries.unshift(d); // 新しい順
  if (logEntries.length > 200) logEntries.pop();
  renderLog();
}

function renderLog() {
  const list = document.getElementById('logList');
  list.innerHTML = logEntries.map(d => `
    <div class="log-row" onclick="jumpToLog(${d.lat}, ${d.lon})">
      <span class="log-time">${formatTime(d.timestamp)}</span>
      <span>
        <span class="log-coords">${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</span>
        <span class="log-speed"> ${d.speed}km/h</span>
      </span>
    </div>`).join('');
}

function jumpToLog(lat, lon) {
  map.setView([lat, lon], 16);
  // 一時マーカーで点滅
  const m = L.circleMarker([lat, lon], { radius: 12, color: '#ffc107', fillOpacity: 0 }).addTo(map);
  setTimeout(() => map.removeLayer(m), 2000);
}

function clearLog() {
  logEntries.length = 0;
  renderLog();
}

function battBadge(batt) {
  if (batt == null) return '';
  const cls = batt > 50 ? 'green' : batt > 20 ? 'yellow' : 'red';
  return `<span class="badge ${cls}">${batt}%</span>`;
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('ja-JP');
}

function updateDevice(d) {
  devices[d.id] = d;
  renderList();
  updateMarker(d);
  if (selectedId === d.id) showDetail(d);
  addLog(d);
  document.getElementById('statusDot').classList.add('active');
  document.getElementById('lastUpdate').textContent = '最終受信: ' + formatTime(d.timestamp);
}

function renderList() {
  const list = document.getElementById('deviceList');
  const ids = Object.keys(devices);
  if (ids.length === 0) return;
  list.innerHTML = ids.map(id => {
    const d = devices[id];
    const sel = id === selectedId ? ' selected' : '';
    return `<div class="device-card${sel}" onclick="selectDevice('${id}')">
      <div class="device-id">📱 ${d.id}${battBadge(d.batt)}</div>
      <div class="device-meta">
        <span>緯度 <span class="val">${d.lat.toFixed(5)}</span></span>
        <span>経度 <span class="val">${d.lon.toFixed(5)}</span></span>
        <span>速度 <span class="val">${d.speed} km/h</span></span>
        ${d.altitude != null ? `<span>高度 <span class="val">${d.altitude.toFixed(0)}m</span></span>` : ''}
      </div>
      <div class="time">${formatTime(d.timestamp)}</div>
    </div>`;
  }).join('');
}

function selectDevice(id) {
  selectedId = id;
  renderList();
  showDetail(devices[id]);
  if (markers[id]) map.setView(markers[id].getLatLng(), 15);
}

function showDetail(d) {
  const panel = document.getElementById('detailPanel');
  const grid = document.getElementById('detailGrid');
  panel.style.display = 'block';
  const rows = [
    ['端末ID', d.id],
    ['緯度', d.lat.toFixed(6)],
    ['経度', d.lon.toFixed(6)],
    ['速度', d.speed + ' km/h'],
    ['バッテリー', d.batt != null ? d.batt + '%' : '—'],
    ['高度', d.altitude != null ? d.altitude.toFixed(1) + ' m' : '—'],
    ['方位', d.bearing != null ? d.bearing.toFixed(0) + '°' : '—'],
    ['精度', d.accuracy != null ? d.accuracy.toFixed(1) + ' m' : '—'],
  ];
  grid.innerHTML = rows.map(([k, v]) => `
    <div class="detail-item">
      <div class="detail-label">${k}</div>
      <div class="detail-value">${v}</div>
    </div>`).join('');
}

function updateMarker(d) {
  const latlng = [d.lat, d.lon];
  if (markers[d.id]) {
    markers[d.id].setLatLng(latlng);
    markers[d.id].getPopup().setContent(popupContent(d));
    if (polylines[d.id]) polylines[d.id].addLatLng(latlng);
    // 選択中の端末なら地図を追従
    if (selectedId === d.id || Object.keys(devices).length === 1) {
      map.panTo(latlng);
    }
  } else {
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:#4a90e2;border:3px solid #fff;border-radius:50%;width:18px;height:18px;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    });
    markers[d.id] = L.marker(latlng, { icon })
      .addTo(map)
      .bindPopup(popupContent(d));
    // 初回：サーバーから軌跡履歴を取得して描画
    fetch(`/api/tracks/${encodeURIComponent(d.id)}`)
      .then(r => r.json())
      .then(pts => {
        const allPts = pts.length ? pts : [latlng];
        polylines[d.id] = L.polyline(allPts, {
          color: '#4a90e2', weight: 3, opacity: 0.8
        }).addTo(map);
      });
    map.setView(latlng, 15);
  }
}

function popupContent(d) {
  return `<b>${d.id}</b><br>速度: ${d.speed} km/h<br>電池: ${d.batt ?? '—'}%<br>${formatTime(d.timestamp)}`;
}

// 起動時に既存データを取得
fetch('/api/devices').then(r => r.json()).then(list => list.forEach(updateDevice));

// SSE でリアルタイム受信（切断時は自動再接続）
let es;
function connectSSE() {
  es = new EventSource('/api/stream');
  es.onmessage = e => updateDevice(JSON.parse(e.data));
  es.onopen = () => {
    document.getElementById('statusDot').classList.add('active');
    document.getElementById('connStatus').textContent = '接続中';
    document.getElementById('connStatus').style.color = '#4caf50';
  };
  es.onerror = () => {
    document.getElementById('statusDot').classList.remove('active');
    document.getElementById('connStatus').textContent = '再接続中...';
    document.getElementById('connStatus').style.color = '#ffc107';
    es.close();
    setTimeout(connectSSE, 3000);
  };
}
connectSSE();
</script>
</body>
</html>
